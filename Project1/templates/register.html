{% extends "base.html" %}
{% block content %}
<div class="card narrow">
    <h2>Create an Account</h2>
    <form method="post" action="{{ url_for('auth.register') }}" novalidate>

        <div class="form-row">
            <div>
                <label>Username *</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div>
                <label>Full Name *</label>
                <input type="text" name="full_name" required>
            </div>
        </div>

        <label>Email *</label>
        <input type="email" name="email" required>

        <div class="form-row">
            <div>
                <label>Password *</label>
                <input type="password" name="password" required minlength="8">
            </div>
            <div>
                <label>Confirm Password *</label>
                <input type="password" name="confirm_password" required>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Department</label>
                <input type="text" name="department" placeholder="e.g. Engineering">
            </div>
            <div>
                <label>Designation</label>
                <input type="text" name="designation" placeholder="e.g. Software Engineer">
            </div>
        </div>

        <label>Grade</label>
        <select name="grade">
            <option value="G1">G1</option>
            <option value="G2">G2</option>
            <option value="G3" selected>G3</option>
            <option value="G4">G4</option>
            <option value="G5">G5</option>
        </select>

        {% if managers %}
        <label>Reporting Manager</label>
        <select name="manager_id">
            <option value="">-- None --</option>
            {% for m in managers %}
            <option value="{{ m.id }}">{{ m.full_name }} ({{ m.emp_code }})</option>
            {% endfor %}
        </select>
        {% endif %}

        <label>Contact Number</label>
        <input type="text" name="contact_number" placeholder="+91 XXXXX XXXXX">

        <button class="btn primary" type="submit">Register</button>
    </form>
    <p class="muted">Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p>
</div>
{% endblock %}
